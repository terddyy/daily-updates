name: Daily Knowledge Scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Manila
      GIT_AUTHOR_NAME: terd-bot
      GIT_AUTHOR_EMAIL: knowledge-bot@users.noreply.github.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update repo content and push
        run: |
          python scripts/update_repo.py --timezone "$TZ"

