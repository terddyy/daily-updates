name: Daily Knowledge Scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Manila
      GIT_AUTHOR_NAME: terddyy
      GIT_AUTHOR_EMAIL: terddy03@gmail.com
      GIT_COMMITTER_NAME: terddyy
      GIT_COMMITTER_EMAIL: terddy03@gmail.com
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update repo content and push
        run: |
          python scripts/update_repo.py --timezone "$TZ"

